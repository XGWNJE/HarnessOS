schema_version = 1
default_review_days = 90

statuses = ["managed", "excluded", "retired"]
computed_freshness = ["current", "stale", "incomplete"]
relationship_types = ["depends-on", "uses", "replaces", "backs-up-to", "published-to"]
profile_tiers = ["required", "standard", "optional"]
platforms = ["windows", "macos", "linux", "web", "cross-platform", "not-applicable"]
preference_sources = ["owner-declared", "verified-public", "unknown"]
provenance_types = ["owner-produced", "third-party"]

software_install_forms = ["portable", "installer", "package-manager", "store", "web", "other", "unknown"]
release_channels = ["lts", "stable", "beta", "nightly", "pinned", "other", "unknown"]
development_tool_kinds = ["version-control", "package-manager", "compiler", "runtime-sdk", "cli", "other"]
upstream_channels = ["winget", "npm", "pypi", "github-releases", "store", "official-api", "official-page", "launcher", "unavailable"]

