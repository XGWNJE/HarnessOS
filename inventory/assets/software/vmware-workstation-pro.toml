notes = "本机 2026-09-13 静默安装 26H1u1，安装包签名有效、签署者为 Broadcom Inc，官方 build 25688693；程序内部版本为 26.0.1 build-25688693，即 26H1u1。官方条款为个人、商业与教育用途均免费且不再需要许可证密钥，安装时密钥框留空。按 owner 确认的版本策略关闭应用内自动更新（AUTOSOFTWAREUPDATE=0），上游升级走人工决策；CEIP 数据收集保持关闭（DATACOLLECTION=0，与图形向导默认不勾选一致）。主机 Hyper-V、虚拟机平台与 WSL2 均未启用，VMware 使用原生 VMM，无需共存配置。下载需 Broadcom 支持门户的免费账号，官方下载页已并入该门户。安装无需重启。上游定位符当前为 26H1 发布说明索引，官方发布下一版本线时需核验并前移到对应索引。虚拟机磁盘、运行状态与主机偏好设置属用户数据，不在本记录恢复范围。"
