last_verified_on = "2026-10-09"
review_days = 90
notes = "官方仓库 ChromeDevTools/chrome-devtools-mcp，Apache-2.0；npm latest 1.10.1（2026-09-23），本机按 @latest 运行、不固定版本。需要 Node.js ^20.19.0 || ^22.12.0 || >=23 与本机 Chrome 稳定版（官方只保证 Google Chrome 与 Chrome for Testing），不需要账号或密钥。默认由服务端自启一个专用 profile 的 Chrome 实例，不连接本地调试端口；连接已打开的 Chrome 需 --browserUrl/--autoConnect 等参数。官方文档含 Windows 专门条目。"
