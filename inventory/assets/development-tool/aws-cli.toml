schema_version = 1
id = "development-tool:aws-cli"
type = "development-tool"
name = "AWS CLI"
domain = "development"
status = "managed"
purpose = "从命令行管理和自动化 Amazon Web Services 资源。"
platforms = ["windows"]
fact_source = "inventory/assets/development-tool/aws-cli.toml"
preference_source = "owner-declared"
provenance = "third-party"
upstream_updates = true
declared_on = "2026-09-04"
