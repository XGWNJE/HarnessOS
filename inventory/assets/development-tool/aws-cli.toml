review_days = 90
notes = "WinGet 包 Amazon.AWSCLI；本机 AWS CLI v2 2.36.36。其私有运行时不依赖系统 Python；账号、访问密钥与会话不纳入仓库。"
relationships = []

[development_tool]
tool_kind = "cli"
