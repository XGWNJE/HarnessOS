schema_version = 1
id = "development-tool:inkscape-mcp"
type = "development-tool"
name = "Inkscape MCP"
domain = "development"
status = "managed"
purpose = "通过 MCP 让 AI 客户端检查、编辑、渲染并导出 Inkscape / SVG 图纸。"
platforms = ["windows"]
fact_source = "inventory/assets/development-tool/inkscape-mcp.toml"
preference_source = "owner-declared"
provenance = "third-party"
upstream_updates = true
declared_on = "2026-10-09"
last_verified_on = "2026-11-09"
review_days = 90
notes = "上游 jjjsood/inkscape-mcp-server 的 pyproject.toml 仍为 0.1.0，MIT、Python >=3.12；这是源码版本，不据此声称已有稳定发行包。本机 Codex 的 inkscape 注册项已启用，使用本地适配 wrapper；本轮未执行渲染或 live 会话验收。配置脚本和机器路径不入库，既有 Windows 兼容性限制恢复时复核。"
tool_kind = "mcp-server"
commands = ["uv run inkscape-mcp"]
install_source = "克隆上游仓库后用 uv 运行（uv sync 后在仓库根执行 uv run inkscape-mcp；也可 uvx --from git+https://github.com/jjjsood/inkscape-mcp.git inkscape-mcp）"
official_source = "https://github.com/jjjsood/inkscape-mcp-server"
version_constraint = "==0.1.0（按上游源码检出运行）"
release_channel = "pinned"
environment_variables = ["INKSCAPE_MCP_WORKSPACE_ROOTS", "PATH"]
config_reference = "Codex 用户级 config.toml 中的 inkscape MCP 服务配置（指向本地入口脚本；只记位置，不复制配置正文）"
verification_commands = ["MCP initialize", "MCP tools/list", "MCP diagnose_runtime"]
upstream_channel = "official-page"
upstream_identifier = "https://github.com/jjjsood/inkscape-mcp-server"

[[relationships]]
type = "depends-on"
target = "development-tool:uv"
