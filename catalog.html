<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>HarnessOS 资产目录</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --surface: #ffffff;
      --surface-subtle: #f4f6fa;
      --text: #101828;
      --text-secondary: #475467;
      --text-muted: #667085;
      --border: #e4e7ec;
      --border-strong: #d0d5dd;
      --accent: #3157d5;
      --accent-soft: #eef2ff;
      --accent-border: #c7d2fe;
      --success: #138a52;
      --success-soft: #eaf8f0;
      --warning: #b65d0d;
      --warning-soft: #fff5e8;
      --danger: #b42318;
      --danger-soft: #fef3f2;
      --shadow-drawer: -18px 0 44px rgba(16, 24, 40, 0.12);
      --radius: 10px;
      --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body.drawer-open { overflow: hidden; }

    button, input, select { font: inherit; }

    button { color: inherit; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 76px;
      padding: 18px 28px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .identity { min-width: 220px; }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      font-weight: 720;
    }

    .summary {
      margin: 5px 0 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    .toolbar {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      max-width: 940px;
    }

    .search-wrap {
      position: relative;
      flex: 1 1 320px;
      max-width: 440px;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      width: 17px;
      height: 17px;
      color: var(--text-muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search {
      width: 100%;
      height: 40px;
      padding: 0 38px;
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    .search::placeholder { color: #98a2b3; }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(49, 87, 213, 0.14);
    }

    .clear-search {
      position: absolute;
      right: 8px;
      top: 7px;
      width: 26px;
      height: 26px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }

    .clear-search.visible { display: inline-flex; }
    .clear-search:hover { background: var(--surface-subtle); color: var(--text); }
    .clear-search svg { width: 14px; height: 14px; }

    .filter {
      height: 40px;
      min-width: 112px;
      padding: 0 34px 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text-secondary);
      outline: none;
      cursor: pointer;
    }

    .filter:focus-visible, .reset:focus-visible, .domain-button:focus-visible,
    .asset-row:focus-visible, .icon-button:focus-visible, .copy-button:focus-visible {
      outline: 3px solid rgba(49, 87, 213, 0.2);
      outline-offset: 2px;
    }

    .reset {
      height: 40px;
      padding: 0 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .reset:hover { background: var(--accent-soft); }

    .workspace {
      min-width: 0;
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
    }

    .domain-rail {
      padding: 22px 16px;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    .rail-label {
      margin: 0 12px 10px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .domain-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .domain-button {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      text-align: left;
      cursor: pointer;
    }

    .domain-button:hover { background: var(--surface-subtle); color: var(--text); }

    .domain-button.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 650;
    }

    .domain-count {
      color: var(--text-muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .domain-button.active .domain-count { color: var(--accent); }

    .content {
      min-width: 0;
      padding: 22px 26px 34px;
    }

    .list-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
    }

    .list-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .result-count {
      margin: 3px 0 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    .freshness-legend {
      display: flex;
      gap: 16px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .legend-item { display: inline-flex; align-items: center; gap: 6px; }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
    }

    .dot.warning { background: var(--warning); }

    .asset-table-wrap {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      height: 42px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: #fbfcfe;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-align: left;
      text-transform: uppercase;
    }

    th:nth-child(1) { width: 36%; }
    th:nth-child(2) { width: 16%; }
    th:nth-child(3) { width: 15%; }
    th:nth-child(4) { width: 15%; }
    th:nth-child(5) { width: 18%; }

    td {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
      vertical-align: middle;
    }

    tbody tr:last-child td { border-bottom: 0; }

    .asset-row {
      cursor: pointer;
      transition: background 100ms ease;
    }

    .asset-row:hover { background: #f8faff; }
    .asset-row.selected { background: var(--accent-soft); }

    .asset-name {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .asset-id {
      display: block;
      overflow: hidden;
      margin-top: 0;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 10.5px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--success);
      font-weight: 600;
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .status.warning { color: var(--warning); }
    .status.danger { color: var(--danger); }

    .upstream { color: var(--text-secondary); }
    .type-cell, .domain-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .empty {
      display: none;
      padding: 76px 24px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty.visible { display: block; }

    .empty strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 15px;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 39;
      display: none;
      background: rgba(16, 24, 40, 0.2);
    }

    .drawer-backdrop.open { display: block; }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      width: min(440px, 92vw);
      overflow-y: auto;
      padding: 24px 28px 36px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow-drawer);
      transform: translateX(105%);
      transition: transform 180ms ease;
    }

    .drawer.open { transform: translateX(0); }

    .drawer-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .drawer-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.28;
      letter-spacing: -0.02em;
    }

    .drawer-id {
      margin: 7px 0 0;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .icon-button {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .icon-button:hover { background: var(--surface-subtle); color: var(--text); }
    .icon-button svg { width: 19px; height: 19px; }

    .drawer-statuses {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 20px;
      padding: 13px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12px;
    }

    .drawer-purpose {
      margin: 22px 0;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.7;
    }

    .details { display: grid; gap: 0; }

    .detail {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 18px;
      padding: 15px 0;
      border-top: 1px solid var(--border);
    }

    .detail-label {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 650;
    }

    .detail-value {
      min-width: 0;
      color: var(--text-secondary);
      overflow-wrap: anywhere;
    }

    .detail-value a { color: var(--accent); text-underline-offset: 3px; }

    .detail-list { margin: 0; padding-left: 18px; }
    .detail-list li + li { margin-top: 5px; }

    .code-line {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface-subtle);
    }

    .code-line + .code-line { margin-top: 7px; }

    code {
      min-width: 0;
      color: #344054;
      font-family: var(--mono);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .copy-button {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: -4px -4px -4px 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }

    .copy-button:hover { background: #e9edf5; color: var(--text); }
    .copy-button svg { width: 15px; height: 15px; }

    .mobile-filters {
      display: none;
      padding: 12px 16px;
      overflow-x: auto;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    @media (max-width: 1100px) {
      .topbar { align-items: flex-start; flex-direction: column; gap: 14px; }
      .toolbar { width: 100%; justify-content: flex-start; max-width: none; }
      .search-wrap { max-width: none; }
      .filter { min-width: 104px; }
    }

    @media (max-width: 820px) {
      .topbar { position: static; padding: 17px 16px 14px; }
      .toolbar { display: grid; grid-template-columns: 1fr auto; }
      .search-wrap { grid-column: 1 / -1; }
      .toolbar .filter { display: none; }
      .reset { justify-self: end; }
      .mobile-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow: visible; }
      .mobile-filters .filter { display: block; width: 100%; min-width: 0; }
      .workspace { display: block; }
      .domain-rail { padding: 10px 16px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); scrollbar-width: none; }
      .domain-rail::-webkit-scrollbar { display: none; }
      .rail-label { display: none; }
      .domain-list { flex-direction: row; width: max-content; }
      .domain-button { width: auto; min-height: 36px; gap: 8px; white-space: nowrap; }
      .content { padding: 18px 16px 28px; }
      .freshness-legend { display: none; }
      th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3), th:nth-child(5), td:nth-child(5) { display: none; }
      th:nth-child(1) { width: 68%; }
      th:nth-child(4) { width: 32%; }
    }

    @media (max-width: 560px) {
      h1 { font-size: 20px; }
      .summary { margin-top: 3px; }
      .toolbar { grid-template-columns: 1fr; }
      .reset { display: none; }
      .list-head { align-items: flex-start; }
      .asset-table-wrap { border-radius: 9px; }
      thead { display: none; }
      tbody { display: block; }
      .asset-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 13px 14px;
        border-bottom: 1px solid var(--border);
      }
      tbody tr:last-child { border-bottom: 0; }
      td { display: none !important; padding: 0; border: 0; }
      td:first-child, td:nth-child(4) { display: block !important; }
      .asset-name { white-space: normal; }
      .drawer { top: 8vh; width: 100%; padding: 20px 20px 34px; border-top: 1px solid var(--border); border-left: 0; border-radius: 14px 14px 0 0; box-shadow: 0 -18px 44px rgba(16, 24, 40, 0.16); transform: translateY(105%); }
      .drawer.open { transform: translateY(0); }
      .drawer-title { font-size: 20px; }
      .detail { grid-template-columns: 1fr; gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="topbar">
      <div class="identity">
        <h1>HarnessOS 资产目录</h1>
        <p class="summary" id="summary"></p>
      </div>
      <div class="toolbar" aria-label="资产筛选">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="m16.2 16.2 4.1 4.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
          <input class="search" id="search" type="search" placeholder="搜索资产名称、ID 或用途" autocomplete="off" aria-label="搜索资产">
          <button class="clear-search" id="clear-search" type="button" aria-label="清空搜索">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
          </button>
        </div>
        <select class="filter" id="status-filter" aria-label="按状态筛选"><option value="">全部状态</option></select>
        <select class="filter" id="freshness-filter" aria-label="按时效筛选"><option value="">全部时效</option></select>
        <button class="reset" id="reset" type="button">清除筛选</button>
      </div>
    </header>

    <div class="mobile-filters" id="mobile-filters" aria-label="移动端资产筛选"></div>

    <div class="workspace">
      <aside class="domain-rail" aria-label="资产领域">
        <p class="rail-label">领域</p>
        <nav class="domain-list" id="domain-list"></nav>
      </aside>

      <main class="content">
        <div class="list-head">
          <div>
            <h2 class="list-title">全部资产</h2>
            <p class="result-count" id="result-count" aria-live="polite"></p>
          </div>
          <div class="freshness-legend" aria-label="时效图例">
            <span class="legend-item"><span class="dot"></span>当前</span>
            <span class="legend-item"><span class="dot warning"></span>需要复核</span>
          </div>
        </div>

        <div class="asset-table-wrap">
          <table aria-label="受管资产列表">
            <thead>
              <tr><th>名称</th><th>类型</th><th>领域</th><th>状态</th><th>上游更新</th></tr>
            </thead>
            <tbody id="asset-rows"></tbody>
          </table>
          <div class="empty" id="empty">
            <strong>没有匹配的资产</strong>
            尝试减少筛选条件或更换关键词。
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="drawer-title" inert>
    <div class="drawer-head">
      <div>
        <h2 class="drawer-title" id="drawer-title"></h2>
        <p class="drawer-id" id="drawer-id"></p>
      </div>
      <button class="icon-button" id="close-drawer" type="button" aria-label="关闭详情">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
      </button>
    </div>
    <div class="drawer-statuses" id="drawer-statuses"></div>
    <p class="drawer-purpose" id="drawer-purpose"></p>
    <div class="details" id="details"></div>

  <script>
    (() => {
      "use strict";

      const data = JSON.parse(document.getElementById("catalog-data").textContent);
      const assets = data.assets;
      const labels = {
        type: data.labels.type,
        domain: data.labels.domain,
        status: { managed: "受管", excluded: "排除", retired: "退役" },
        freshness: { current: "当前", stale: "已过期", incomplete: "信息不完整" }
      };

      const state = { query: "", domain: "", status: "", freshness: "", selected: "" };
      const el = id => document.getElementById(id);
      const summary = el("summary");
      const search = el("search");
      const clearSearch = el("clear-search");
      const statusFilter = el("status-filter");
      const freshnessFilter = el("freshness-filter");
      const domainList = el("domain-list");
      const rows = el("asset-rows");
      const resultCount = el("result-count");
      const empty = el("empty");
      const drawer = el("drawer");
      const backdrop = el("drawer-backdrop");
      let lastFocusedAssetId = "";

      const label = (group, value) => labels[group][value] || value;
      const unique = key => [...new Set(assets.map(asset => asset[key]))].sort((a, b) => a.localeCompare(b, "zh-CN"));

      function appendOptions(select, key) {
        unique(key).forEach(value => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label(key, value);
          select.appendChild(option);
        });
      }

      function cloneMobileFilter(source, stateKey) {
        const clone = source.cloneNode(true);
        clone.id = `mobile-${source.id}`;
        clone.setAttribute("aria-label", source.getAttribute("aria-label"));
        clone.addEventListener("change", () => {
          state[stateKey] = clone.value;
          source.value = clone.value;
          render();
        });
        el("mobile-filters").appendChild(clone);
        return clone;
      }

      appendOptions(statusFilter, "status");
      appendOptions(freshnessFilter, "freshness");

      const mobileFilters = {
        status: cloneMobileFilter(statusFilter, "status"),
        freshness: cloneMobileFilter(freshnessFilter, "freshness")
      };

      summary.textContent = `${data.assetCount} 项资产 · ${data.profileCount} 个配置档`;

      function syncFilter(key, value) {
        state[key] = value;
        const desktop = { status: statusFilter, freshness: freshnessFilter }[key];
        desktop.value = value;
        mobileFilters[key].value = value;
      }

      function renderDomainRail() {
        domainList.replaceChildren();
        const counts = assets.reduce((map, asset) => {
          map[asset.domain] = (map[asset.domain] || 0) + 1;
          return map;
        }, {});
        const entries = [["", "全部领域", assets.length], ...Object.keys(counts)
          .sort((a, b) => label("domain", a).localeCompare(label("domain", b), "zh-CN"))
          .map(domain => [domain, label("domain", domain), counts[domain]])];
        entries.forEach(([value, text, count]) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `domain-button${state.domain === value ? " active" : ""}`;
          button.setAttribute("aria-pressed", String(state.domain === value));
          const name = document.createElement("span");
          name.textContent = text;
          const number = document.createElement("span");
          number.className = "domain-count";
          number.textContent = count;
          button.append(name, number);
          button.addEventListener("click", () => {
            state.domain = value;
            renderDomainRail();
            render();
          });
          domainList.appendChild(button);
        });
      }

      function matches(asset) {
        if (state.domain && asset.domain !== state.domain) return false;
        if (state.status && asset.status !== state.status) return false;
        if (state.freshness && asset.freshness !== state.freshness) return false;
        if (!state.query) return true;
        const haystack = JSON.stringify(asset).toLocaleLowerCase("zh-CN");
        return haystack.includes(state.query.toLocaleLowerCase("zh-CN"));
      }

      function statusClass(asset) {
        if (asset.status === "retired" || asset.status === "excluded") return "danger";
        return asset.freshness === "current" ? "" : "warning";
      }

      function statusText(asset) {
        if (asset.status !== "managed") return label("status", asset.status);
        return label("freshness", asset.freshness);
      }

      function makeCell(className, text) {
        const cell = document.createElement("td");
        cell.className = className;
        cell.textContent = text;
        return cell;
      }

      function renderRows(filtered) {
        rows.replaceChildren();
        filtered.forEach(asset => {
          const row = document.createElement("tr");
          row.className = `asset-row${state.selected === asset.id ? " selected" : ""}`;
          row.tabIndex = 0;
          row.dataset.assetId = asset.id;
          row.setAttribute("aria-label", `查看 ${asset.name} 详情`);

          const identity = document.createElement("td");
          const name = document.createElement("span");
          name.className = "asset-name";
          name.textContent = asset.name;
          const id = document.createElement("span");
          id.className = "asset-id";
          id.textContent = asset.id;
          identity.append(name, id);

          const statusCell = document.createElement("td");
          const status = document.createElement("span");
          status.className = `status ${statusClass(asset)}`.trim();
          status.textContent = statusText(asset);
          statusCell.appendChild(status);

          row.append(
            identity,
            makeCell("type-cell", label("type", asset.type)),
            makeCell("domain-cell", label("domain", asset.domain)),
            statusCell,
            makeCell("upstream", asset.upstream)
          );
          row.addEventListener("click", () => openDrawer(asset, row));
          row.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openDrawer(asset, row);
            }
          });
          rows.appendChild(row);
        });
      }

      function render() {
        const filtered = assets.filter(matches);
        renderRows(filtered);
        resultCount.textContent = `显示 ${filtered.length} / ${assets.length} 项`;
        empty.classList.toggle("visible", filtered.length === 0);
        clearSearch.classList.toggle("visible", Boolean(state.query));
      }

      const copyIcon = () => {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("fill", "none");
        svg.setAttribute("aria-hidden", "true");
        const first = document.createElementNS(svg.namespaceURI, "rect");
        first.setAttribute("x", "8"); first.setAttribute("y", "8"); first.setAttribute("width", "11"); first.setAttribute("height", "11"); first.setAttribute("rx", "2");
        first.setAttribute("stroke", "currentColor"); first.setAttribute("stroke-width", "1.7");
        const second = document.createElementNS(svg.namespaceURI, "path");
        second.setAttribute("d", "M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2");
        second.setAttribute("stroke", "currentColor"); second.setAttribute("stroke-width", "1.7"); second.setAttribute("stroke-linecap", "round");
        svg.append(first, second);
        return svg;
      };

      function codeLine(value) {
        const line = document.createElement("div");
        line.className = "code-line";
        const code = document.createElement("code");
        code.textContent = value;
        const copy = document.createElement("button");
        copy.type = "button";
        copy.className = "copy-button";
        copy.setAttribute("aria-label", `复制 ${value}`);
        copy.appendChild(copyIcon());
        copy.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(value);
            copy.setAttribute("aria-label", "已复制");
          } catch (_) {
            copy.setAttribute("aria-label", "浏览器不允许从本地页面复制，请手动选择文本");
          }
        });
        line.append(code, copy);
        return line;
      }

      function detailValue(detail) {
        const wrapper = document.createElement("div");
        wrapper.className = "detail-value";
        const values = Array.isArray(detail.value) ? detail.value : [detail.value];
        if (detail.kind === "url") {
          let safeUrl = null;
          try {
            const candidate = new URL(detail.value);
            if (candidate.protocol === "http:" || candidate.protocol === "https:") safeUrl = candidate.href;
          } catch (_) { /* render invalid sources as plain text */ }
          if (safeUrl) {
            const link = document.createElement("a");
            link.href = safeUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = detail.value;
            wrapper.appendChild(link);
          } else {
            wrapper.textContent = detail.value;
          }
        } else if (detail.kind === "code" || detail.kind === "codes") {
          values.forEach(value => wrapper.appendChild(codeLine(String(value))));
        } else if (detail.kind === "list") {
          const list = document.createElement("ul");
          list.className = "detail-list";
          values.forEach(value => {
            const item = document.createElement("li");
            item.textContent = value;
            list.appendChild(item);
          });
          wrapper.appendChild(list);
        } else {
          wrapper.textContent = values.join("、");
        }
        return wrapper;
      }

      function openDrawer(asset, trigger) {
        lastFocusedAssetId = asset.id;
        state.selected = asset.id;
        el("drawer-title").textContent = asset.name;
        el("drawer-id").textContent = asset.id;
        el("drawer-purpose").textContent = asset.purpose;
        const statuses = el("drawer-statuses");
        statuses.replaceChildren();
        [label("type", asset.type), label("domain", asset.domain), asset.provenance, `上游：${asset.upstream}`, statusText(asset)].forEach(text => {
          const item = document.createElement("span");
          item.textContent = text;
          statuses.appendChild(item);
        });
        const details = el("details");
        details.replaceChildren();
        asset.details.forEach(detail => {
          const row = document.createElement("div");
          row.className = "detail";
          const key = document.createElement("div");
          key.className = "detail-label";
          key.textContent = detail.label;
          row.append(key, detailValue(detail));
          details.appendChild(row);
        });
        drawer.classList.add("open");
        backdrop.classList.add("open");
        document.body.classList.add("drawer-open");
        el("app-shell").setAttribute("inert", "");
        drawer.removeAttribute("inert");
        drawer.setAttribute("aria-hidden", "false");
        history.replaceState(null, "", `#${encodeURIComponent(asset.id)}`);
        render();
        el("close-drawer").focus();
      }

      function closeDrawer() {
        if (!drawer.classList.contains("open")) return;
        drawer.classList.remove("open");
        backdrop.classList.remove("open");
        document.body.classList.remove("drawer-open");
        drawer.setAttribute("inert", "");
        drawer.setAttribute("aria-hidden", "true");
        el("app-shell").removeAttribute("inert");
        state.selected = "";
        history.replaceState(null, "", location.pathname + location.search);
        render();
        const focusTarget = document.querySelector(`[data-asset-id="${CSS.escape(lastFocusedAssetId)}"]`);
        if (focusTarget) focusTarget.focus();
      }

      search.addEventListener("input", () => { state.query = search.value.trim(); render(); });
      clearSearch.addEventListener("click", () => { search.value = ""; state.query = ""; search.focus(); render(); });
      statusFilter.addEventListener("change", () => { syncFilter("status", statusFilter.value); render(); });
      freshnessFilter.addEventListener("change", () => { syncFilter("freshness", freshnessFilter.value); render(); });
      el("reset").addEventListener("click", () => {
        search.value = "";
        state.query = "";
        state.domain = "";
        ["status", "freshness"].forEach(key => syncFilter(key, ""));
        renderDomainRail();
        render();
      });
      el("close-drawer").addEventListener("click", closeDrawer);
      backdrop.addEventListener("click", closeDrawer);
      document.addEventListener("keydown", event => { if (event.key === "Escape") closeDrawer(); });

      renderDomainRail();
      render();

      const hashId = decodeURIComponent(location.hash.slice(1));
      const initial = assets.find(asset => asset.id === hashId);
      if (initial) openDrawer(initial, null);
    })();
  </script>
</body>
</html>
